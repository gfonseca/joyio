[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joyio"
version = "0.1.0"
description = "Canonical Joy-Con input events for Linux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evdev>=1.9,<2",
]

[project.scripts]
joyio = "joyio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
