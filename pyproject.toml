[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joyio"
version = "0.3.0"
description = "Joy-Con keyboard and mouse mapping for Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "JoyIO contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
keywords = ["joycon", "nintendo", "input", "bluetooth", "uinput", "linux"]
dependencies = [
    "evdev>=1.9,<2",
    "jeepney>=0.9,<1",
    "Pillow>=10,<12",
    "PyYAML>=6.0,<7",
]

license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/gfonseca/joyio"
Repository = "https://github.com/gfonseca/joyio"
Issues = "https://github.com/gfonseca/joyio/issues"

[project.scripts]
joyio = "joyio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"joyio.icons" = ["*.png"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
